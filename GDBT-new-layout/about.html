<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{project.about.tabTitle}} — {{project.titleSuffix}}</title>
<script src="/project.js"></script>
<script src="/colors.js"></script>
<link rel="stylesheet" href="style.css">
<style>

/* ── Layout ── */
.about-shell {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: calc(100vh - 52px);
}

/* ── Sidebar ── */
.about-sidebar {
  background: #faf6ef;
  border-right: 1px solid var(--border);
  padding: 1.4rem 0 3rem;
  position: sticky; top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.sidebar-label {
  font-family: 'Crimson Pro', serif;
  font-size: 0.67rem; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--ink-light); padding: 0 1rem 0.5rem; display: block;
}
.about-toc { list-style: none; padding: 0; margin: 0; }
.about-toc a {
  display: block; font-family: 'Crimson Pro', serif; font-size: 1rem;
  color: var(--ink-mid); text-decoration: none;
  padding: 3px 1rem 3px 1.1rem;
  border-left: 3px solid transparent;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  line-height: 1.5;
}
.about-toc a:hover  { background: #ede4d4; color: var(--ink); }
.about-toc a.active { background: #e8d8b8; color: var(--ink); border-left-color: var(--gold); font-weight: 500; }
.about-toc .sub a {
  font-size: 0.88rem; padding-left: 1.9rem; color: var(--ink-light);
}
.about-toc .sub a:hover { color: var(--ink); }
.about-toc .sub a.active { color: var(--ink); border-left-color: var(--gold-lt); background: #f0e8d8; }

/* Map thumbnail in sidebar */
.sidebar-map {
  margin: 1.5rem 0.85rem 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.sidebar-map img { display: block; width: 100%; height: auto; }

/* ── Main content ── */
.about-main {
  padding: 2.5rem 4.5rem 6rem;
  max-width: 820px;
}

/* Page title */
.page-title {
  font-family: 'EB Garamond', serif;
  font-size: 2.6rem; font-weight: 500;
  color: var(--ink); line-height: 1.1;
  margin-bottom: 0.3rem;
}
.page-subtitle {
  font-family: 'Crimson Pro', serif;
  font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-light); margin-bottom: 2.5rem;
}

/* Section headings */
.about-main h2 {
  font-family: 'EB Garamond', serif;
  font-size: 1.75rem; font-weight: 500;
  color: var(--ink);
  border-bottom: 2px solid var(--gold);
  padding-bottom: 0.3rem;
  margin: 2.8rem 0 1rem;
  scroll-margin-top: 1.5rem;
}
.about-main h2:first-of-type { margin-top: 0; }

.about-main h3 {
  font-family: 'EB Garamond', serif;
  font-size: 1.25rem; font-weight: 500;
  color: var(--ink);
  margin: 2rem 0 0.6rem;
  scroll-margin-top: 1.5rem;
}

.about-main p {
  font-family: 'Crimson Pro', serif;
  font-size: 1.08rem; line-height: 1.82;
  color: var(--ink-mid); margin-bottom: 0.9rem;
}
.about-main strong { font-weight: 600; color: var(--ink); }
.about-main em     { font-style: italic; }

/* ── Language cards ── */
.lang-section {
  border-left: 4px solid;
  border-radius: 0 6px 6px 0;
  padding: 1.4rem 1.8rem 1.6rem;
  margin: 2rem 0 2.5rem;
  background: #fdfbf7;
  scroll-margin-top: 1.5rem;
}
.lang-section h3 {
  font-family: 'EB Garamond', serif;
  font-size: 1.6rem; font-weight: 500;
  margin: 0 0 0.2rem;
  border: none;
}
.lang-section .lang-meta {
  font-family: 'Crimson Pro', serif;
  font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-light); margin-bottom: 1rem;
  display: flex; flex-wrap: wrap; gap: 0 1.2rem;
}
.lang-section .lang-meta span { white-space: nowrap; }
.lang-section p {
  font-family: 'Crimson Pro', serif;
  font-size: 1.05rem; line-height: 1.8;
  color: var(--ink-mid); margin-bottom: 0.8rem;
}
.lang-links {
  display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem;
}
.lang-link {
  font-family: 'Crimson Pro', serif;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.05em;
  color: white; border-radius: 3px;
  padding: 3px 14px 4px; text-decoration: none;
  transition: opacity 0.15s;
}
.lang-link:hover { opacity: 0.82; }

/* Speaker count badge */
.speaker-badge {
  display: inline-block;
  font-family: 'Source Code Pro', monospace;
  font-size: 0.72rem; letter-spacing: 0.04em;
  background: var(--border);
  border-radius: 3px; padding: 1px 7px;
  color: var(--ink-light);
  vertical-align: middle;
  margin-left: 0.4rem;
}

/* Infobox */
.infobox {
  float: right; clear: right;
  margin: 0 0 1.5rem 2rem;
  background: #faf6ef;
  border: 1px solid var(--border);
  border-top: 3px solid var(--gold);
  border-radius: 0 0 4px 4px;
  padding: 0.9rem 1.1rem;
  width: 240px;
  font-family: 'Crimson Pro', serif;
  font-size: 0.88rem;
  line-height: 1.6;
}
.infobox table { width: 100%; border-collapse: collapse; }
.infobox td { padding: 2px 0; vertical-align: top; }
.infobox td:first-child { color: var(--ink-light); width: 45%; padding-right: 0.5rem; }
.infobox td:last-child   { color: var(--ink); font-weight: 500; }
.infobox caption {
  font-family: 'EB Garamond', serif; font-size: 1rem; font-weight: 500;
  color: var(--ink); text-align: left; margin-bottom: 0.5rem; caption-side: top;
}

/* More button (back-link style) */
.back-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Crimson Pro', serif; font-size: 0.88rem;
  color: var(--gold); text-decoration: none;
  border-bottom: 1px solid var(--border-lt);
  padding-bottom: 1px; margin-bottom: 2rem; display: inline-block;
  transition: color 0.12s, border-color 0.12s;
}
.back-link:hover { color: #b84c10; border-color: #b84c10; }

</style>
</head>
<body>

<nav class="topnav">
  <a class="topnav-brand" href="index.html">◬ {{project.name}}</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="grammar.html">Grammar</a></li>
    <li><a href="texts.html">Texts</a></li>
    <li><a href="dictionary.html">Dictionary</a></li>
  </ul>
  <div class="topnav-right">{{project.nav.about}}</div>
</nav>

<div class="about-shell">

  <!-- ── Sidebar ── -->
  <aside class="about-sidebar">
    <span class="sidebar-label">On this page</span>
    <ul class="about-toc" id="about-toc">
{{block:about.toc}}    </ul>
    {{block:about.sidebarmap}}
  </aside>

  <!-- ── Main ── -->
  <main class="about-main">

    <a class="back-link" href="index.html">← Back to homepage</a>

    <h1 class="page-title">{{project.about.title}}</h1>
    <div class="page-subtitle">{{project.about.subtitle}}</div>

    {{block:about.sections}}
  </main>
</div>

{{block:footer}}

<script>
// ── Scrollspy ──────────────────────────────────────────────────
const tocLinks = document.querySelectorAll('.about-toc a');
window.addEventListener('scroll', () => {
  const headings = document.querySelectorAll(
    '.about-main h2[id], .lang-section[id]'
  );
  let activeId = null;
  headings.forEach(h => {
    if (h.getBoundingClientRect().top < 130) activeId = h.id;
  });
  tocLinks.forEach(a =>
    a.classList.toggle('active', a.getAttribute('href') === '#' + activeId)
  );
}, { passive: true });

// ── Smooth scroll for TOC links ────────────────────────────────
tocLinks.forEach(a => {
  a.addEventListener('click', e => {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) {
      e.preventDefault();
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
});

// ── Scroll to hash on load (e.g. about.html#<language>) ───────
window.addEventListener('load', () => {
  const hash = window.location.hash.slice(1);
  if (hash) {
    const el = document.getElementById(hash);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
  }
});
</script>
</body>
</html>
