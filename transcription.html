<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcription — DBT Gaua Languages</title>
<link rel="stylesheet" href="style.css">
<style>

/* ── Layout ── */
.tx-shell {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: calc(100vh - 52px);
}

/* ── Sidebar ── */
.tx-sidebar {
  background: #faf6ef;
  border-right: 1px solid var(--border);
  padding: 1.2rem 0 3rem;
  position: sticky; top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.tx-sidebar-label {
  font-family: 'Crimson Pro', serif;
  font-size: 0.67rem; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--ink-light); padding: 0 1rem 0.5rem; display: block;
}
.tx-nav { list-style: none; padding: 0; margin: 0; }
.tx-nav a {
  display: block; font-family: 'Crimson Pro', serif; font-size: 0.9rem;
  color: var(--ink-mid); text-decoration: none;
  padding: 3px 1rem 3px 1.1rem;
  border-left: 3px solid transparent;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx-nav a:hover  { background: #ede4d4; color: var(--ink); }
.tx-nav a.active { background: #e8d8b8; color: var(--ink); border-left-color: var(--gold); }
.tx-nav .tx-nav-id {
  font-family: 'Source Code Pro', monospace; font-size: 0.68rem;
  color: var(--ink-light); display: block;
}

/* ── Main ── */
.tx-main { padding: 2rem 4rem 6rem; max-width: 860px; }

.tx-header {
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--gold);
}
.tx-back {
  font-family: 'Crimson Pro', serif; font-size: 0.85rem;
  color: var(--gold); text-decoration: none;
  border-bottom: 1px solid var(--border-lt);
  transition: color 0.12s; display: inline-block; margin-bottom: 0.8rem;
}
.tx-back:hover { color: #b84c10; }
.tx-title {
  font-family: 'EB Garamond', serif; font-size: 2rem; font-weight: 500;
  color: var(--ink); line-height: 1.15; margin-bottom: 0.3rem;
}
.tx-meta {
  font-family: 'Crimson Pro', serif; font-size: 0.8rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-light);
  display: flex; gap: 1.2rem; flex-wrap: wrap;
}

/* ── Phrase blocks ── */
.tx-phrase {
  border-bottom: 1px solid var(--border-lt);
  padding: 1rem 0 1.1rem;
  scroll-margin-top: 4px;
  transition: background 0.1s;
}
.tx-phrase:hover { background: #fffdf7; }
.tx-phrase:last-child { border-bottom: none; }

.tx-phrase-id {
  font-family: 'Source Code Pro', monospace; font-size: 0.65rem;
  color: var(--ink-light); letter-spacing: 0.06em;
  margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.6rem;
}
.tx-audio-badge {
  font-size: 0.6rem; background: #f0e8d8; border: 1px solid var(--border);
  border-radius: 2px; padding: 1px 5px; color: var(--ink-light);
}

/* Line 1 — FORM (original language) */
.tx-form {
  font-family: 'EB Garamond', serif; font-size: 1.35rem; font-weight: 500;
  color: var(--ink); line-height: 1.6; margin-bottom: 0.35rem;
}

/* Line 2 — GLOSS (interlinear, editable) */
.tx-gloss-wrap { margin-bottom: 0.35rem; }
.tx-gloss-label {
  font-family: 'Source Code Pro', monospace; font-size: 0.6rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-light); margin-right: 0.4rem;
}
.tx-gloss-text {
  font-family: 'Source Code Pro', monospace; font-size: 0.82rem;
  color: var(--ink-mid); line-height: 1.55; letter-spacing: 0.02em;
}
.tx-gloss-text.empty { color: #ccc; font-style: italic; font-family: 'Crimson Pro', serif; font-size: 0.85rem; }
.tx-gloss-input {
  font-family: 'Source Code Pro', monospace; font-size: 0.82rem;
  color: var(--ink); line-height: 1.55; letter-spacing: 0.02em;
  width: 100%; border: none; border-bottom: 1.5px dashed var(--border);
  background: transparent; outline: none; padding: 2px 0;
  transition: border-color 0.15s;
  resize: none; overflow: hidden;
}
.tx-gloss-input:focus { border-bottom-color: var(--gold); }
.tx-gloss-input::placeholder { color: #c0b090; font-style: italic; font-family: 'Crimson Pro', serif; }
.tx-gloss-save-status {
  font-family: 'Crimson Pro', serif; font-size: 0.72rem;
  color: #267040; margin-left: 0.5rem; opacity: 0; transition: opacity 0.3s;
}
.tx-gloss-save-status.visible { opacity: 1; }

/* Line 3 — TRANSL (English translation) */
.tx-transl {
  font-family: 'Crimson Pro', serif; font-size: 1.05rem; font-style: italic;
  color: var(--ink-light); line-height: 1.7;
}

/* ── Word-aligned interlinear (when W/M glosses exist in XML) ── */
.tx-aligned {
  display: flex; flex-wrap: wrap;
  gap: 0.1rem 1.1rem; align-items: flex-end;
  margin-bottom: 0.35rem;
  padding: 0.3rem 0;
}
.tx-word { display: flex; flex-direction: column; align-items: flex-start; }
.tx-word-form {
  font-family: 'EB Garamond', serif; font-size: 1.12rem;
  color: var(--ink); line-height: 1.4;
}
.tx-word-gloss {
  font-family: 'Source Code Pro', monospace; font-size: 0.7rem;
  color: var(--ink-light); letter-spacing: 0.03em; line-height: 1.4;
  white-space: nowrap;
}

/* ── Fieldnotes interlinear table (rows = languages, like grammar example) ── */
.fn-interlinear {
  background: #faf6ef;
  border-left: 3px solid var(--gold);
  border-radius: 0 4px 4px 0;
  padding: 0.65rem 1.1rem 0.8rem;
  overflow-x: auto;
  display: inline-block;
  min-width: 200px;
  max-width: 100%;
  margin-bottom: 0.35rem;
}
.fn-il-table   { border-collapse: collapse; white-space: nowrap; }
.fn-lang-abbr  {
  font-family: 'Crimson Pro', serif; font-variant: small-caps;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.05em;
  padding: 2px 14px 2px 0; vertical-align: baseline; border: none;
}
.fn-form-cell  {
  font-family: 'EB Garamond', serif; font-size: 1.12rem;
  padding: 2px 20px 2px 0; vertical-align: baseline; border: none;
}
.fn-form-cell.missing { color: #ccc; font-size: 0.95rem; }
.fn-sep td  { border-top: 1px solid var(--border); padding: 0; height: 0; border-bottom: none; }
.fn-gloss-label-cell {
  font-family: 'Source Code Pro', monospace; font-size: 0.6rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-light); padding: 5px 14px 3px 0;
  vertical-align: baseline; border: none; font-variant: normal;
}
.fn-gloss-input-cell { padding: 5px 20px 3px 0; vertical-align: baseline; border: none; }

/* ── Hover tooltip ── */
#tx-tooltip {
  position: fixed; z-index: 9999; pointer-events: none;
  opacity: 0; transition: opacity 0.08s ease; max-width: 300px;
}
#tx-tooltip.visible  { opacity: 1; }
#tx-tooltip.interactive { pointer-events: auto; }

/* Grammar link inside tooltip */
.tt-grammar-link { margin-top: 6px; }
.tt-grammar-link a {
  font-family: 'Crimson Pro', serif; font-size: 0.8rem;
  color: #c9a458; text-decoration: none;
  border-bottom: 1px solid rgba(201,164,88,0.35);
  transition: color 0.1s, border-color 0.1s;
}
.tt-grammar-link a:hover { color: #fdeec8; border-bottom-color: #fdeec8; }
/* Author edit row for grammar link */
.tt-grammar-edit {
  margin-top: 6px; display: flex; gap: 4px; align-items: center;
}
.tt-link-input {
  font-family: 'Source Code Pro', monospace; font-size: 0.72rem;
  background: rgba(255,255,255,0.1); color: #f0dfc0;
  border: 1px solid rgba(201,164,88,0.3); border-radius: 2px;
  padding: 2px 6px; outline: none; flex: 1; min-width: 0;
  transition: border-color 0.12s;
}
.tt-link-input:focus { border-color: rgba(201,164,88,0.7); }
.tt-link-input::placeholder { color: rgba(201,164,88,0.4); }
.tt-link-save {
  font-family: 'Crimson Pro', serif; font-size: 0.75rem;
  background: rgba(201,164,88,0.2); color: #c9a458;
  border: 1px solid rgba(201,164,88,0.3); border-radius: 2px;
  padding: 2px 8px 3px; cursor: pointer; white-space: nowrap;
  transition: background 0.12s;
}
.tt-link-save:hover { background: rgba(201,164,88,0.35); }
#tx-tooltip .tt-inner {
  background: #1c0f06; color: #f0dfc0;
  border-radius: 5px; padding: 9px 14px 10px;
  box-shadow: 0 4px 18px rgba(0,0,0,.38), 0 0 0 1px rgba(201,164,88,.25);
  font-family: 'Crimson Pro', serif; font-size: 0.9rem; line-height: 1.5;
}
#tx-tooltip .tt-hw   { font-family: 'EB Garamond', serif; font-size: 1.1rem; font-weight: 500; color: #fdeec8; }
#tx-tooltip .tt-pos  { font-style: italic; font-size: 0.78rem; color: #c9a458; margin-left: 4px; }
#tx-tooltip .tt-def  { color: #e8d0a8; margin-top: 3px; font-size: 0.86rem; }
#tx-tooltip .tt-desc { color: #c0a880; margin-top: 3px; font-size: 0.8rem; line-height: 1.4; }
#tx-tooltip .tt-equivs { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
#tx-tooltip .tt-eq { font-family: 'Source Code Pro', monospace; font-size: 0.7rem; background: rgba(255,255,255,.09); border-radius: 2px; padding: 1px 5px; }
#tx-tooltip .tt-eq b { font-weight: 600; }

/* Hoverable form cells and gloss cells */
.fn-form-cell[data-form]:not(.missing) { cursor: default; }
.fn-form-cell[data-form]:not(.missing):hover { text-decoration: underline dotted currentColor; }
.fn-gloss-cell { cursor: default; }

/* ── Gloss status badge (? / ✓) ── */
.gloss-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; min-width: 16px; border-radius: 50%;
  background: #1c0f06; color: white;
  font-size: 0.65rem; font-weight: 700; line-height: 1;
  cursor: pointer; user-select: none;
  transition: background 0.15s, transform 0.1s;
  position: relative; margin-right: 7px;
}
.gloss-badge:hover { background: #3a2010; transform: scale(1.1); }
.gloss-badge.confirmed { background: #267040; }
.gloss-badge.confirmed:hover { background: #1a5030; }
.gloss-badge.no-click { cursor: default; }
/* CSS tooltip */
.gloss-badge::after {
  content: attr(data-tooltip);
  position: absolute; left: 120%; top: 50%; transform: translateY(-50%);
  background: #1c0f06; color: #f0dfc0;
  font-family: 'Crimson Pro', serif; font-size: 0.78rem; font-weight: 400;
  white-space: nowrap; padding: 4px 10px 5px;
  border-radius: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  pointer-events: none; opacity: 0; transition: opacity 0.12s;
  z-index: 200; font-variant: normal; letter-spacing: 0;
}
.gloss-badge:hover::after { opacity: 1; }
.gloss-badge-empty { display: inline-block; width: 16px; height: 16px; min-width: 16px; margin-right: 7px; }

/* ── Gloss concordance dropdown ── */
.fn-gloss-control { display: inline-flex; align-items: center; gap: 3px; }
.fn-gloss-select {
  font-family: 'Source Code Pro', monospace; font-size: 0.74rem;
  border: 1px solid var(--border); border-radius: 2px;
  padding: 1px 4px; background: white; color: var(--ink);
  outline: none; cursor: pointer; max-width: 13ch;
  transition: border-color 0.12s;
}
.fn-gloss-select:focus { border-color: var(--gold); }
.fn-gloss-new-input {
  font-family: 'Source Code Pro', monospace; font-size: 0.74rem;
  border: none; border-bottom: 1.5px dashed var(--border);
  background: transparent; outline: none;
  padding: 1px 0; width: 9ch;
  transition: border-color 0.15s;
}
.fn-gloss-new-input:focus { border-bottom-color: var(--gold); }

/* Per-column gloss input */
.fn-col-gloss {
  font-family: 'Source Code Pro', monospace; font-size: 0.75rem;
  color: var(--ink-light); border: none;
  border-bottom: 1.5px dashed var(--border);
  background: transparent; outline: none;
  padding: 1px 0; width: 100%; min-width: 3ch;
  max-width: 14ch; transition: border-color 0.15s;
}
.fn-col-gloss:focus { border-bottom-color: var(--gold); color: var(--ink); }
.fn-col-gloss::placeholder { color: #c8b890; }

/* Inline alignment editor */
.fn-editor {
  background: #f5f0e8; border: 1px solid var(--border);
  border-radius: 4px; padding: 0.8rem 1rem 1rem;
  margin-bottom: 0.4rem; overflow-x: auto;
}
.fn-editor-table { border-collapse: collapse; }
.fn-editor-table td { padding: 2px 4px; vertical-align: middle; }
.fn-cell-input {
  font-family: 'EB Garamond', serif; font-size: 1rem;
  border: 1px solid var(--border); border-radius: 2px;
  padding: 2px 5px; width: 7ch; min-width: 4ch;
  outline: none; background: white;
  transition: border-color 0.12s;
}
.fn-cell-input:focus { border-color: var(--gold); }
.fn-editor-abbr { font-family: 'Crimson Pro', serif; font-variant: small-caps; font-size: 0.8rem; font-weight: 700; padding-right: 8px; }
.fn-col-del { font-size: 0.7rem; color: #c06060; background: none; border: none; cursor: pointer; padding: 0 4px; }
.fn-col-del:hover { color: #922810; }
.fn-col-add { font-family: 'Crimson Pro', serif; font-size: 0.8rem; color: var(--gold); background: none; border: 1px dashed var(--gold); border-radius: 3px; padding: 2px 8px; cursor: pointer; margin-left: 6px; }
.fn-col-add:hover { background: #f5edd8; }
.fn-editor-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; justify-content: flex-end; }
.fn-edit-btn { font-family: 'Crimson Pro', serif; font-size: 0.75rem; color: var(--ink-light); background: none; border: 1px solid var(--border); border-radius: 3px; padding: 2px 9px 3px; cursor: pointer; position: absolute; top: 0; right: 0; transition: border-color 0.12s, color 0.12s; }
.fn-edit-btn:hover { color: var(--gold); border-color: var(--gold); }

/* Translation language tag */
.tx-transl-lang {
  font-family: 'Source Code Pro', monospace; font-size: 0.62rem;
  color: var(--ink-light); letter-spacing: 0.08em; text-transform: uppercase;
  margin-right: 0.35rem; vertical-align: middle;
}

/* ── Editable translation ── */
.tx-transl-wrap {
  display: flex; align-items: baseline; gap: 0.4rem;
  margin-bottom: 0.2rem;
}
.tx-transl-label {
  font-family: 'Source Code Pro', monospace; font-size: 0.6rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-light); flex-shrink: 0;
}
.tx-transl-input {
  font-family: 'Crimson Pro', serif; font-style: italic;
  font-size: 1rem; color: var(--ink-mid);
  border: none; border-bottom: 1.5px dashed var(--border);
  background: transparent; outline: none; flex: 1;
  padding: 1px 0; transition: border-color 0.15s;
}
.tx-transl-input:focus { border-bottom-color: var(--gold); }
.tx-transl-input::placeholder { color: #c0b090; font-style: italic; }

/* Visual morpheme-boundary connector between prefix/suffix gloss cells */
.fn-gloss-input-cell.morph-right::after {
  content: '-'; color: var(--ink-light);
  font-family: 'Source Code Pro', monospace; font-size: 0.7rem;
  padding-left: 1px;
}
.fn-gloss-input-cell.morph-left::before {
  content: '-'; color: var(--ink-light);
  font-family: 'Source Code Pro', monospace; font-size: 0.7rem;
  padding-right: 1px;
}

/* Loading / error */
.tx-loading {
  font-family: 'Crimson Pro', serif; font-style: italic;
  color: var(--ink-light); padding: 3rem 0;
}
.tx-error { color: #922810; font-style: normal; font-size: 0.95rem; }

/* Gloss legend (shown when logged in) */
.gloss-legend {
  display: none;
  background: #f5f0e8; border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 0 4px 4px 0;
  padding: 0.7rem 1rem; margin-bottom: 2rem;
  font-family: 'Crimson Pro', serif; font-size: 0.85rem; color: var(--ink-light);
}
.gloss-legend.visible { display: block; }
.gloss-legend strong { color: var(--ink); }

</style>
</head>

<script>
'use strict';

// ── Read URL params ───────────────────────────────────────────
const params        = new URLSearchParams(window.location.search);
const isFieldnotes  = params.get('fieldnotes') === '1';
const textKey       = params.get('key')   || '';
const fnIndex       = parseInt(params.get('index') || '0', 10);
const textTitle     = params.get('title') || 'Transcription';
const textLangParam = params.get('lang')  || '';
// Gloss key: filename for recordings, fieldnotes_N for fieldnotes
const glossKey = isFieldnotes ? ('fieldnotes_' + fnIndex) : textKey;
// Gloss endpoint: dedicated routes for fieldnotes, /api/transcription/ for recordings
function glossUrl() {
  return isFieldnotes
    ? `/api/fieldnotes/tx/${fnIndex}/glosses`
    : `/api/transcription/${encodeURIComponent(textKey)}/glosses`;
}

// ── Language colours ──────────────────────────────────────────
const LANG_COLORS = {
  Nume:'#2e5c8a', Dorig:'#c07820', Koro:'#922810', Olrat:'#267040', Lakon:'#5c2878'
};
// ISO code → colour (for fieldnotes comparative display)
const CODE_COLORS = {
  num:'#2e5c8a', drg:'#c07820', kro:'#922810', olr:'#267040', lkn:'#5c2878'
};
// Map ISO 639-3 / Pangloss codes → Gaua language names
const LANG_FROM_CODE = {
  wwo:'Dorig', drg:'Dorig', lkn:'Lakon', krf:'Koro',
  kro:'Koro',  num:'Nume',  olr:'Olrat',
};
// textLang from URL may be an ISO code or a language name
const textLang = LANG_FROM_CODE[textLangParam] || textLangParam;
const langColor = LANG_COLORS[textLang] || 'var(--gold)';

// ── State ─────────────────────────────────────────────────────
let sentences = [];
let glosses   = {};
let saveTimers = {};

// ── Scrollspy ─────────────────────────────────────────────────
function bindScrollspy() {
  window.addEventListener('scroll', () => {
    let active = null;
    document.querySelectorAll('.tx-phrase').forEach(el => {
      if (el.getBoundingClientRect().top < 130) active = el.id;
    });
    document.querySelectorAll('.tx-nav a').forEach(a =>
      a.classList.toggle('active', a.getAttribute('href') === '#' + active)
    );
  }, { passive: true });
}

// ── Fieldnotes column-aligned table helpers ───────────────────

const FN_CODES = ['num','drg','kro','olr','lkn'];
const FN_ABBRS = {num:'Num',drg:'Drg',kro:'Kro',olr:'Olr',lkn:'Lkn'};

function tokenizeForm(form) {
  // Split on whitespace first, then on morpheme boundary markers (- and =)
  // keeping the marker with the left part (ve- stays as 've-', not split to 've' + 'bon̄').
  // Trailing punctuation (. , ; !) is stripped from each token.
  if (!form || form === '—') return [];
  const tokens = [];
  for (const word of form.trim().split(/\s+/).filter(Boolean)) {
    const clean = word.replace(/[.,;!?]+$/, '');   // strip trailing punctuation
    if (!clean) continue;
    if (!clean.includes('-') && !clean.includes('=')) {
      tokens.push(clean); continue;
    }
    // Split on - and =, keeping delimiter with left fragment
    const parts = clean.split(/([-=])/);
    let cur = '';
    const frags = [];
    for (const p of parts) {
      if (p === '-' || p === '=') { cur += p; frags.push(cur); cur = ''; }
      else { cur = p; }
    }
    if (cur) frags.push(cur);
    tokens.push(...frags.filter(t => t));
  }
  return tokens;
}

function buildAlignment(words, stored) {
  // Returns {tokens: {code: [...]}, colGlosses: [...], nCols: N}
  if (stored && typeof stored === 'object' && stored.tokens) {
    const nCols = Math.max(...FN_CODES.map(c => (stored.tokens[c] || []).length), 0);
    const tokens = {};
    FN_CODES.forEach(c => {
      tokens[c] = [...(stored.tokens[c] || [])];
      while (tokens[c].length < nCols) tokens[c].push('');
    });
    return { tokens, colGlosses: stored.glosses || Array(nCols).fill(''), nCols };
  }
  // Auto-tokenize
  const tokens = {};
  let nCols = 0;
  words.forEach(w => {
    const toks = tokenizeForm(w.form);
    tokens[w.lang] = toks;
    if (toks.length > nCols) nCols = toks.length;
  });
  FN_CODES.forEach(c => {
    tokens[c] = tokens[c] || [];
    while (tokens[c].length < nCols) tokens[c].push('');
  });
  return { tokens, colGlosses: Array(nCols).fill(''), nCols };
}

function renderAlignedTable(words, tokens, colGlosses, nCols, sid, editable) {
  const emptyHeader = `<td></td>`;
  const langRows = words.map(w => {
    const col = CODE_COLORS[w.lang] || 'var(--gold)';
    const cells = Array.from({length: nCols}, (_, i) => {
      const form = tokens[w.lang]?.[i] || '';
      return `<td class="fn-form-cell${!form ? ' missing' : ''}"
                  style="color:${col};"
                  data-lang="${w.lang}"
                  data-form="${form || '—'}">${form || '—'}</td>`;
    }).join('');
    return `<tr>
      <td class="fn-lang-abbr" style="color:${col};">${FN_ABBRS[w.lang]}</td>
      ${cells}
    </tr>`;
  }).join('');

  const sepCells = `<td></td>${Array(nCols).fill('<td></td>').join('')}`;
  const glossCells = Array.from({length: nCols}, (_, i) => {
    const ctrl = renderColGlossControl(words, tokens, sid, i, colGlosses[i], editable);
    const g    = (colGlosses[i] || '').replace(/"/g, '&quot;');
    return `<td class="fn-gloss-input-cell fn-gloss-cell" data-gloss="${g}">${ctrl}</td>`;
  }).join('');

  // Badge: ? = has glosses but unconfirmed; ✓ = confirmed; empty = no glosses
  const stored2    = glosses[sid];
  const hasAnyGloss = colGlosses.some(g => g);
  const confirmed  = stored2?.confirmed === true;
  const badgeEl = hasAnyGloss
    ? `<span class="gloss-badge${confirmed ? ' confirmed' : ''}${editable ? '' : ' no-click'}"
             id="gbadge-${sid}"
             data-sid="${sid}"
             data-tooltip="${confirmed
               ? 'Gloss confirmed by the author'
               : 'Automatically glossed from previous examples, needs confirmation by the author'
             }">${confirmed ? '✓' : '?'}</span>`
    : `<span class="gloss-badge-empty" id="gbadge-${sid}"></span>`;

  return `<table class="fn-il-table" id="fn-table-${sid}">
    ${langRows}
    <tr class="fn-sep">${sepCells}</tr>
    <tr>
      <td class="fn-gloss-label-cell" style="white-space:nowrap;">${badgeEl}gloss</td>
      ${glossCells}
    </tr>
  </table>`;
}

function buildComparativeSection(s, storedGloss, editable) {
  const {tokens, colGlosses, nCols} = buildAlignment(s.words, storedGloss);
  const editBtn = editable
    ? `<button class="fn-edit-btn" onclick="showAlignmentEditor('${s.id}',this)"
              title="Edit column alignment">✏</button>`
    : '';
  const tableHTML  = renderAlignedTable(s.words, tokens, colGlosses, nCols, s.id, editable);
  const storedT    = (glosses[s.id]?.translation !== undefined)
    ? glosses[s.id].translation : s.transl;
  const translHTML = renderTranslationField(s.id, storedT, editable);
  return `<div class="fn-interlinear" style="position:relative;">
    ${editBtn}
    <div id="fn-display-${s.id}">${tableHTML}</div>
    <div id="fn-editor-${s.id}" style="display:none;"></div>
  </div>${translHTML}`;
}

function showAlignmentEditor(sid, btn) {
  const phrase   = btn.closest('.tx-phrase');
  const stored   = glosses[sid];
  const wordEls  = [...phrase.querySelectorAll('.fn-form-cell, .fn-lang-abbr')]; // unused, use data
  // Rebuild alignment from current displayed table or stored data
  const s = sentences.find(s => s.id === sid);
  if (!s) return;
  const {tokens, colGlosses, nCols} = buildAlignment(s.words, stored);

  // Work on a mutable copy
  const editTokens    = {};
  FN_CODES.forEach(c => { editTokens[c] = [...(tokens[c] || [])]; });
  let editGlosses = [...colGlosses];
  let editNCols   = nCols;

  function renderEditor() {
    const colHeaders = Array.from({length: editNCols}, (_, i) =>
      `<td style="text-align:center;padding:0 4px 2px;">
        <button class="fn-col-del" onclick="delCol(${i})">×</button>
      </td>`
    ).join('');

    const langRows2 = s.words.map(w => {
      const col = CODE_COLORS[w.lang] || 'var(--gold)';
      const cells = Array.from({length: editNCols}, (_, i) => {
        const val = (editTokens[w.lang]?.[i] || '').replace(/"/g, '&quot;');
        return `<td><input class="fn-cell-input" data-lang="${w.lang}" data-col="${i}"
                       value="${val}" spellcheck="false"
                       style="color:${col};"
                       oninput="editTokens['${w.lang}'][${i}]=this.value"></td>`;
      }).join('');
      return `<tr>
        <td class="fn-editor-abbr" style="color:${col};">${FN_ABBRS[w.lang]}</td>
        ${cells}
        <td></td>
      </tr>`;
    }).join('');

    const glossCells2 = Array.from({length: editNCols}, (_, i) => {
      const val = (editGlosses[i] || '').replace(/"/g, '&quot;');
      return `<td><input class="fn-cell-input" data-col="${i}"
                     value="${val}" placeholder="gloss" spellcheck="false"
                     oninput="editGlosses[${i}]=this.value"
                     style="font-family:'Source Code Pro',monospace;font-size:0.75rem;"></td>`;
    }).join('');

    const editorDiv = document.getElementById('fn-editor-' + sid);
    editorDiv.innerHTML = `<div class="fn-editor">
      <table class="fn-editor-table">
        <tr><td></td>${colHeaders}<td></td></tr>
        ${langRows2}
        <tr><td style="font-size:0.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);padding-right:8px;">gloss</td>${glossCells2}<td></td></tr>
      </table>
      <div class="fn-editor-actions">
        <button class="fn-col-add" onclick="addCol()">+ Column</button>
        <button class="modal-btn" onclick="cancelEdit('${sid}')">Cancel</button>
        <button class="modal-btn primary" onclick="saveAlignment('${sid}')">Save</button>
      </div>
    </div>`;

    // Re-attach event handlers for inputs (since innerHTML was reset)
    editorDiv.querySelectorAll('input[data-lang]').forEach(inp => {
      inp.addEventListener('input', () => {
        const lang = inp.dataset.lang;
        const col  = parseInt(inp.dataset.col);
        editTokens[lang][col] = inp.value;
      });
    });
    editorDiv.querySelectorAll('input:not([data-lang])').forEach(inp => {
      if (inp.dataset.col !== undefined) {
        inp.addEventListener('input', () => {
          editGlosses[parseInt(inp.dataset.col)] = inp.value;
        });
      }
    });
  }

  function addCol() {
    editNCols++;
    FN_CODES.forEach(c => { editTokens[c] = editTokens[c] || []; editTokens[c].push(''); });
    editGlosses.push('');
    renderEditor();
  }
  function delCol(i) {
    if (editNCols <= 1) return;
    editNCols--;
    FN_CODES.forEach(c => { editTokens[c].splice(i, 1); });
    editGlosses.splice(i, 1);
    renderEditor();
  }

  // Make helpers accessible to onclick
  window.addCol  = addCol;
  window.delCol  = delCol;
  window.cancelEdit = (s) => {
    document.getElementById('fn-editor-' + s).style.display = 'none';
    document.getElementById('fn-display-' + s).style.display = '';
    btn.style.display = '';
  };
  window.saveAlignment = async (s) => {
    // Editing the alignment resets confirmation
    const newData = {tokens: editTokens, glosses: editGlosses, confirmed: false};
    glosses[s] = newData;
    try {
      await fetch(glossUrl(), {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({sentence_id: s, gloss: newData}),
        keepalive: true,
      });
    } catch(e) { console.error(e); }
    // Re-render the display
    const display = document.getElementById('fn-display-' + s);
    display.innerHTML = renderAlignedTable(
      sentences.find(x => x.id === s).words,
      editTokens, editGlosses, editNCols, s, true
    );
    buildConcordanceFromGlosses();
    bindColGlossFull();
    bindNarrGlossInputs();
    bindTranslationInputs();
    bindHoverTooltips();
    document.getElementById('fn-editor-' + s).style.display = 'none';
    display.style.display = '';
    btn.style.display = '';
  };

  document.getElementById('fn-display-' + sid).style.display = 'none';
  document.getElementById('fn-editor-' + sid).style.display = '';
  btn.style.display = 'none';
  renderEditor();
}

// ── Dictionary entries (loaded once for gloss lookup) ────────
let dictEntries = []; // [{id, gloss, forms: {num, drg, kro, olr, lkn}}]

async function loadDictionary() {
  try {
    const r = await fetch('/api/dictionary/entries');
    if (!r.ok) return;
    const d = await r.json();
    dictEntries = d.entries || [];
    buildDictLookups();
  } catch(e) { /* dictionary lookup unavailable */ }
}

function getDictionaryGlosses(words, tokens, colIdx) {
  if (!dictEntries.length) return { full: [], partial: [] };
  const full    = new Set();
  const partial = new Set();

  FN_CODES.forEach(langCode => {
    const raw   = (tokens[langCode]?.[colIdx] || '').trim();
    if (!raw || raw === '—') return;
    // Strip morpheme boundary markers for comparison
    const clean = raw.replace(/^[-=]+|[-=.,;]+$/g, '').toLowerCase();

    dictEntries.forEach(entry => {
      const dictRaw   = (entry.forms[langCode] || '').trim();
      if (!dictRaw) return;
      const dictClean = dictRaw.replace(/^[-=]+|[-=.,;]+$/g, '').toLowerCase();
      if (!dictClean || !entry.gloss) return;

      if (dictClean === clean || dictRaw.toLowerCase() === raw.toLowerCase()) {
        full.add(entry.gloss);
      } else if (
        clean.length >= 2 && dictClean.length >= 2 &&
        (clean.includes(dictClean) || dictClean.includes(clean))
      ) {
        partial.add(entry.gloss);
      }
    });
  });

  // Remove from partial anything already in full
  full.forEach(g => partial.delete(g));
  return { full: [...full], partial: [...partial] };
}

let abbrevLinks = {};

async function loadAbbrevLinks() {
  try {
    const r = await fetch('/api/abbrev_links');

  } catch(e) {}
}

async function saveAbbrevLink(abbr, link) {
  try {
    await fetch('/api/abbrev_links', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({abbr, link})
    });

    if (!link) delete abbrevLinks[abbr];
  } catch(e) { console.error(e); }
}

// ── Dictionary form/gloss lookup maps ────────────────────────
let dictByGloss = {}; // short gloss (lowercase) → entry
let dictByForm  = {}; // "langCode:form(lowercase)" → entry

function buildDictLookups() {
  dictByGloss = {};
  dictByForm  = {};
  dictEntries.forEach(entry => {
    if (entry.gloss) dictByGloss[entry.gloss.toLowerCase()] = entry;
    Object.entries(entry.forms || {}).forEach(([lang, form]) => {
      if (!form || form === '—') return;
      const key   = `${lang}:${form.toLowerCase()}`;
      const clean = form.replace(/^[-=]+|[-=.,;]+$/g,'').toLowerCase();
      dictByForm[key] = entry;
      if (clean !== form.toLowerCase()) dictByForm[`${lang}:${clean}`] = entry;
    });
  });
}

function _abbrTooltipHTML(abbr, info) {
  const link = abbrevLinks[abbr] || '';
  const linkRow = link

let _hideTimer = null;

function _bindTooltipInteraction() {
  const t = document.getElementById('tx-tooltip');
  // When logged in, allow mouse to enter tooltip to interact with the edit row
  t.classList.toggle('interactive', isLoggedIn);
  if (isLoggedIn) {
    t.addEventListener('mouseenter', () => clearTimeout(_hideTimer));
    t.addEventListener('mouseleave', hideTooltip);
    // Save button handler (delegated)
    t.addEventListener('click', async e => {
      const btn = e.target.closest('.tt-link-save');
      if (!btn) return;
      const abbr  = btn.dataset.abbr;
      const input = t.querySelector(`.tt-link-input[data-abbr="${abbr}"]`);
      const link  = input ? input.value.trim() : '';
      await saveAbbrevLink(abbr, link);
      // Update the link row immediately
      const linkRow = t.querySelector('.tt-grammar-link');
      if (link) {
        const html = `<a href="${link}">📐 See in grammar →</a>`;
        if (linkRow) linkRow.innerHTML = html;
        else input.closest('.tt-inner').insertAdjacentHTML(
          'afterbegin',
          `<div class="tt-grammar-link">${html}</div>`
        );
      } else if (linkRow) {
        linkRow.remove();
      }
      btn.textContent = '✓';
      setTimeout(() => { btn.textContent = 'Save'; }, 1200);
    });
  }
}

function _positionTooltip(el) {
  const t    = document.getElementById('tx-tooltip');
  const rect = el.getBoundingClientRect();
  const tw   = Math.min(300, window.innerWidth - 16);
  let left   = rect.left + rect.width / 2 - 24;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if (left < 8) left = 8;
  const ttH  = t.offsetHeight || 80;
  t.style.left = left + 'px';
  t.style.top  = (rect.top - ttH - 8 < 8)
    ? (rect.bottom + 8 + window.scrollY) + 'px'
    : (rect.top - ttH - 8 + window.scrollY) + 'px';
}

function showFormTooltip(el) {
  const lang = el.dataset.lang;
  const form = el.dataset.form;
  if (!lang || !form || form === '—') return;
  const clean  = form.replace(/^[-=]+|[-=.,;]+$/g,'').toLowerCase();
  const entry  = dictByForm[`${lang}:${form.toLowerCase()}`]
              || dictByForm[`${lang}:${clean}`];
  if (!entry) return;
  const t = document.getElementById('tx-tooltip');
  t.querySelector('.tt-inner').innerHTML = _dictTooltipHTML(entry);
  t.classList.add('visible');
  _positionTooltip(el);
}

function showGlossTooltip(el) {
  // Read current gloss from whatever control is in the cell
  let g = '';
  const sel  = el.querySelector('.fn-gloss-select');
  const inp  = el.querySelector('.fn-col-gloss');
  const span = el.querySelector('.tx-gloss-text:not(.empty)');
  if      (sel  && sel.value && sel.value !== '__new__') g = sel.value;
  else if (inp)                                          g = inp.value;
  else if (span)                                         g = span.textContent;
  else                                                   g = el.dataset.gloss || '';
  g = g.replace(/^~/, '').trim();
  if (!g || g === '—') return;

  // 1. Dictionary entry?
  const entry = dictByGloss[g.toLowerCase()];
  if (entry) {
    const t = document.getElementById('tx-tooltip');
    t.querySelector('.tt-inner').innerHTML = _dictTooltipHTML(entry);
    t.classList.add('visible');
    _positionTooltip(el);
    return;
  }
  // 2. Abbreviation legend?
  const info = ABBREV_LEGEND[g] || ABBREV_LEGEND[g.toUpperCase()];
  if (info) {
    const t = document.getElementById('tx-tooltip');
    t.querySelector('.tt-inner').innerHTML = _abbrTooltipHTML(g, info);
    t.classList.add('visible');
    _positionTooltip(el);
  }
}

function hideTooltip() {
  clearTimeout(_hideTimer);
  _hideTimer = setTimeout(() =>
    document.getElementById('tx-tooltip').classList.remove('visible'), 80);
}

function bindHoverTooltips() {
  // Form cells (language rows)
  document.querySelectorAll('.fn-form-cell[data-form]').forEach(cell => {
    cell.addEventListener('mouseenter', () => { clearTimeout(_hideTimer); showFormTooltip(cell); });
    cell.addEventListener('mouseleave', hideTooltip);
  });
  // Gloss cells (gloss row)
  document.querySelectorAll('.fn-gloss-cell').forEach(cell => {
    cell.addEventListener('mouseenter', () => { clearTimeout(_hideTimer); showGlossTooltip(cell); });
    cell.addEventListener('mouseleave', hideTooltip);
  });
}

function renderTranslationField(sid, currentTransl, editable) {
  const t = (currentTransl || '').replace(/"/g, '&quot;');
  if (!editable) {
    return `<div class="tx-transl">${currentTransl || ''}</div>`;
  }
  return `<div class="tx-transl-wrap">
    <span class="tx-transl-label">transl.</span>
    <input class="tx-transl-input" data-sid="${sid}"
           value="${t}" placeholder="Add translation…" spellcheck="true">
    <span class="tx-gloss-save-status" id="tstatus-${sid}"></span>
  </div>`;
}

async function saveTranslation(sid, value, statusEl) {
  const stored = glosses[sid];
  const newData = (stored && typeof stored === 'object')
    ? {...stored, translation: value}
    : {translation: value};
  glosses[sid] = newData;
  try {
    await fetch(glossUrl(), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sentence_id: sid, gloss: newData}),
      keepalive: true
    });
    if (statusEl) {
      statusEl.textContent = '✓'; statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 1200);
    }
  } catch(e) { console.error(e); }
}

function bindTranslationInputs() {
  document.querySelectorAll('.tx-transl-input').forEach(inp => {
    const sid = inp.dataset.sid;
    const statusEl = document.getElementById('tstatus-' + sid);
    // Debounced save while typing
    inp.addEventListener('input', () => {
      clearTimeout(saveTimers['t_' + sid]);
      saveTimers['t_' + sid] = setTimeout(
        () => saveTranslation(sid, inp.value, statusEl), 700
      );
    });
    // Immediate save when field loses focus (user clicks away / navigates)
    inp.addEventListener('blur', () => {
      clearTimeout(saveTimers['t_' + sid]);
      saveTranslation(sid, inp.value, statusEl);
    });
  });
}

// ── Narrative column-aligned section (Case B: no XML W/M glosses) ────────────

function buildNarrativeSection(s, storedGloss, editable) {
  // Resolve tokens and glosses
  let tokens, colGlosses, translation;
  if (storedGloss && typeof storedGloss === 'object' && storedGloss.tokens) {
    tokens      = storedGloss.tokens;
    colGlosses  = storedGloss.glosses || [];
    translation = storedGloss.translation !== undefined
      ? storedGloss.translation : s.transl;
  } else {
    tokens      = tokenizeForm(s.form);
    colGlosses  = [];
    translation = s.transl || '';
  }
  const nCols = tokens.length;
  while (colGlosses.length < nCols) colGlosses.push('');

  const confirmed   = storedGloss?.confirmed === true;
  const hasAnyGloss = colGlosses.some(g => g);

  // Badge
  const badgeEl = hasAnyGloss
    ? `<span class="gloss-badge${confirmed ? ' confirmed' : ''}${editable ? '' : ' no-click'}"
             id="gbadge-${s.id}" data-sid="${s.id}"
             data-tooltip="${confirmed
               ? 'Gloss confirmed by the author'
               : 'Automatically glossed from previous examples, needs confirmation by the author'
             }">${confirmed ? '✓' : '?'}</span>`
    : `<span class="gloss-badge-empty" id="gbadge-${s.id}"></span>`;

  // Form row (single language, using the transcription's colour)
  const langCode = textLangParam;
  const formCells = tokens.map((form, i) =>
    `<td class="fn-form-cell${!form ? ' missing' : ''}"
         style="color:${langColor};"
         data-lang="${langCode}" data-form="${form}">${form || '—'}</td>`
  ).join('');

  // Gloss row — simple inputs per column, with morpheme-connector classes
  const glossCells = tokens.map((form, i) => {
    const g         = (colGlosses[i] || '').replace(/"/g, '&quot;');
    const endsHyph  = form.endsWith('-') || form.endsWith('=');
    const startsHyph= form.startsWith('-') || form.startsWith('=');
    const extraClass= endsHyph ? ' morph-right' : startsHyph ? ' morph-left' : '';
    const ctrl = editable
      ? `<input class="fn-col-gloss narr-gloss" data-sid="${s.id}" data-col="${i}"
               value="${g}" placeholder="…" spellcheck="false">`
      : `<span class="${g ? 'tx-gloss-text' : 'tx-gloss-text empty'}">${g || '—'}</span>`;
    return `<td class="fn-gloss-input-cell fn-gloss-cell${extraClass}"
                data-gloss="${g}">${ctrl}</td>`;
  }).join('');

  const sepCells = '<td></td>'.repeat(nCols);

  const editBtn = editable
    ? `<button class="fn-edit-btn"
              onclick="showNarrativeAlignmentEditor('${s.id}', this)"
              title="Edit column alignment">✏</button>`
    : '';

  const translField = renderTranslationField(s.id, translation || '', editable);

  return `<div class="fn-interlinear" style="position:relative;">
    ${editBtn}
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">${badgeEl}</div>
    <div id="fn-display-${s.id}">
      <table class="fn-il-table">
        <tr>${formCells}</tr>
        <tr class="fn-sep">${sepCells}</tr>
        <tr>${glossCells}</tr>
      </table>
    </div>
    <div id="fn-editor-${s.id}" style="display:none;"></div>
  </div>
  ${translField}`;
}

function showNarrativeAlignmentEditor(sid, btn) {
  if (!isLoggedIn) { showLoginModal(); return; }
  const s = sentences.find(x => x.id === sid);
  if (!s) return;
  const stored = glosses[sid];
  let editTokens = (stored?.tokens) ? [...stored.tokens] : tokenizeForm(s.form);
  let editGlosses = (stored?.glosses) ? [...stored.glosses] : Array(editTokens.length).fill('');
  while (editGlosses.length < editTokens.length) editGlosses.push('');

  function renderNarrativeEditor() {
    const colHeaders = editTokens.map((_, i) =>
      `<td style="text-align:center;padding:0 4px 2px;">
         <button class="fn-col-del" onclick="narDelCol(${i})">×</button>
       </td>`
    ).join('');
    const formCells = editTokens.map((form, i) =>
      `<td><input class="fn-cell-input" data-col="${i}" value="${form.replace(/"/g,'&quot;')}"
                  spellcheck="false" style="color:${langColor};"
                  oninput="editTokens[${i}]=this.value"></td>`
    ).join('');
    const glossCells = editTokens.map((_, i) =>
      `<td><input class="fn-cell-input" data-col="${i}"
                  value="${(editGlosses[i]||'').replace(/"/g,'&quot;')}" placeholder="gloss"
                  spellcheck="false"
                  style="font-family:'Source Code Pro',monospace;font-size:0.75rem;"
                  oninput="editGlosses[${i}]=this.value"></td>`
    ).join('');
    const editorDiv = document.getElementById('fn-editor-' + sid);
    editorDiv.innerHTML = `<div class="fn-editor">
      <table class="fn-editor-table">
        <tr><td></td>${colHeaders}<td></td></tr>
        <tr><td class="fn-editor-abbr" style="color:${langColor};">${textLang}</td>${formCells}<td></td></tr>
        <tr><td style="font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);padding-right:8px;">gloss</td>${glossCells}<td></td></tr>
      </table>
      <div class="fn-editor-actions">
        <button class="fn-col-add" onclick="narAddCol()">+ Column</button>
        <button class="modal-btn" onclick="cancelNarrEdit('${sid}')">Cancel</button>
        <button class="modal-btn primary" onclick="saveNarrAlignment('${sid}')">Save</button>
      </div>
    </div>`;
    editorDiv.querySelectorAll('input[data-col]').forEach(inp => {
      inp.addEventListener('input', () => {
        const col = parseInt(inp.dataset.col);
        // Determine if form or gloss row
        if (inp.closest('tr').querySelectorAll('input').length === editTokens.length) {
          const isFormRow = Array.from(inp.closest('tr').previousElementSibling?.querySelectorAll('td') || []).some(td => td.textContent === textLang);
          // Just rely on oninput inline handlers above
        }
      });
    });
  }

  window.narAddCol  = () => { editTokens.push(''); editGlosses.push(''); renderNarrativeEditor(); };
  window.narDelCol  = (i) => { if (editTokens.length <= 1) return; editTokens.splice(i,1); editGlosses.splice(i,1); renderNarrativeEditor(); };
  window.cancelNarrEdit = (s) => {
    document.getElementById('fn-editor-'+s).style.display = 'none';
    document.getElementById('fn-display-'+s).style.display = '';
    btn.style.display = '';
  };
  window.saveNarrAlignment = async (s) => {
    const stored2   = glosses[s];
    const prevTransl = stored2?.translation !== undefined
      ? stored2.translation
      : sentences.find(x=>x.id===s)?.transl || '';
    const newData   = {
      ...(typeof stored2==='object' ? stored2 : {}),
      tokens: editTokens, glosses: editGlosses, confirmed: false,
      translation: prevTransl
    };
    glosses[s] = newData;
    updateBadge(s, editGlosses);
    await fetch(glossUrl(), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sentence_id: s, gloss: newData}),
      keepalive: true,
    });
    // Re-render the display section
    const sent    = sentences.find(x => x.id === s);
    const wrapper = document.getElementById('fn-display-'+s).closest('.fn-interlinear');
    if (wrapper && sent) {
      const tmp = document.createElement('div');
      tmp.innerHTML = buildNarrativeSection(sent, newData, true);
      const newInterlinear = tmp.querySelector('.fn-interlinear');
      if (newInterlinear) wrapper.replaceWith(newInterlinear);
    }
    buildConcordanceFromGlosses();
    bindNarrGlossInputs();
    bindHoverTooltips();
    bindTranslationInputs();
  };

  document.getElementById('fn-display-'+sid).style.display='none';
  document.getElementById('fn-editor-'+sid).style.display='';
  btn.style.display='none';
  renderNarrativeEditor();
}

function bindNarrGlossInputs() {
  document.querySelectorAll('input.narr-gloss').forEach(inp => {
    const sid = inp.dataset.sid;
    const col = parseInt(inp.dataset.col);
    const statusEl = document.getElementById('gstatus-' + sid + '-' + col);
    inp.addEventListener('input', () => {
      clearTimeout(saveTimers[`${sid}_nc${col}`]);
      saveTimers[`${sid}_nc${col}`] = setTimeout(() => {
        const stored = glosses[sid];
        const toks   = stored?.tokens || tokenizeForm(sentences.find(x=>x.id===sid)?.form || '');
        const cg     = stored?.glosses ? [...stored.glosses] : Array(toks.length).fill('');
        while (cg.length < toks.length) cg.push('');
        cg[col] = inp.value;
        const newData = {...(typeof stored==='object'?stored:{}), tokens:toks, glosses:cg, confirmed:false};
        glosses[sid] = newData;
        updateBadge(sid, cg);
        fetch(glossUrl(), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sentence_id: sid, gloss: newData}),
          keepalive: true,
        }).catch(console.error);
      }, 600);
    });
  });
}

// ── Concordance: colKey → Set of glosses ─────────────────────
let concordance = {};

function getColKey(words, tokens, colIdx) {
  return FN_CODES.map(c => (tokens[c]?.[colIdx] || '')).join('|');
}

function buildConcordanceFromGlosses() {
  concordance = {};
  sentences.forEach(s => {
    if (!s.is_comparative) return;
    const stored = glosses[s.id];
    if (!stored || typeof stored !== 'object' || !stored.tokens || !stored.glosses) return;
    const {tokens, glosses: cg} = stored;
    cg.forEach((g, i) => {
      if (!g) return;
      const key = getColKey(s.words, tokens, i);
      if (!concordance[key]) concordance[key] = new Set();
      concordance[key].add(g);
    });
  });
}

function renderColGlossControl(words, tokens, sid, colIdx, currentGloss, editable) {
  const g        = currentGloss || '';
  const statusId = `gstatus-${sid}-${colIdx}`;

  if (!editable) {
    return `<span class="${g ? 'tx-gloss-text' : 'tx-gloss-text empty'}">${g || '—'}</span>`;
  }

  const key         = getColKey(words, tokens, colIdx);
  const concordSugg = concordance[key] ? [...concordance[key]] : [];
  const dictSugg    = getDictionaryGlosses(words, tokens, colIdx);

  // Filter dict suggestions to avoid duplicating concordance entries
  const dictFull    = dictSugg.full.filter(x => !concordSugg.includes(x));
  const dictPartial = dictSugg.partial.filter(x =>
    !concordSugg.includes(x) && !dictSugg.full.includes(x));

  const hasSuggestions = concordSugg.length || dictFull.length || dictPartial.length;

  if (!hasSuggestions) {
    // No suggestions — plain input
    return `<input class="fn-col-gloss" data-sid="${sid}" data-col="${colIdx}"
                   value="${g.replace(/"/g,'&quot;')}" placeholder="…" spellcheck="false">
            <span class="tx-gloss-save-status" id="${statusId}"></span>`;
  }

  const allKnown = [...concordSugg, ...dictFull, ...dictPartial];
  const hasMatch = allKnown.includes(g);
  const emptyOpt = `<option value=""${!g ? ' selected':''}>—</option>`;

  let groupsHTML = '';

  if (concordSugg.length) {
    const opts = concordSugg.map(s =>
      `<option value="${s.replace(/"/g,'&quot;')}"${s===g?' selected':''}>${s}</option>`
    ).join('');
    groupsHTML += `<optgroup label="Previous glosses">${opts}</optgroup>`;
  }

  if (dictFull.length) {
    const opts = dictFull.map(s =>
      `<option value="${s.replace(/"/g,'&quot;')}"${s===g?' selected':''}>${s}</option>`
    ).join('');
    groupsHTML += `<optgroup label="📖 Dictionary">${opts}</optgroup>`;
  }

  if (dictPartial.length) {
    const opts = dictPartial.map(s =>
      `<option value="${s.replace(/"/g,'&quot;')}"${s===g?' selected':''}>~${s}</option>`
    ).join('');
    groupsHTML += `<optgroup label="📖 Dictionary (partial match)">${opts}</optgroup>`;
  }

  const newOpt    = `<option value="__new__"${g && !hasMatch ? ' selected' : ''}>+ New</option>`;
  const newHidden = g && !hasMatch ? '' : 'display:none;';

  return `<div class="fn-gloss-control" data-sid="${sid}" data-col="${colIdx}">
    <select class="fn-gloss-select">${emptyOpt}${groupsHTML}${newOpt}</select>
    <input  class="fn-gloss-new-input" style="${newHidden}"
            value="${(g && !hasMatch ? g : '').replace(/"/g,'&quot;')}"
            placeholder="New gloss…" spellcheck="false">
    <span class="tx-gloss-save-status" id="${statusId}"></span>
  </div>`;
}

// ── Badge: confirmation toggle ────────────────────────────────
function updateBadge(sid, colGlosses) {
  const badge = document.getElementById('gbadge-' + sid);
  if (!badge) return;
  const hasGloss  = (colGlosses || []).some(g => g);
  const confirmed = glosses[sid]?.confirmed === true;
  if (!hasGloss) {
    badge.className   = 'gloss-badge-empty';
    badge.textContent = '';
    return;
  }
  badge.textContent = confirmed ? '✓' : '?';
  badge.className   = `gloss-badge${confirmed ? ' confirmed' : ''}${isLoggedIn ? '' : ' no-click'}`;
  badge.dataset.tooltip = confirmed
    ? 'Gloss confirmed by the author'
    : 'Automatically glossed from previous examples, needs confirmation by the author';
}

async function toggleConfirmation(sid) {
  const stored = glosses[sid];
  if (!stored || typeof stored !== 'object') return;
  const newConf  = !stored.confirmed;
  glosses[sid]   = {...stored, confirmed: newConf};
  // Update badge appearance immediately
  const badge = document.getElementById('gbadge-' + sid);
  if (badge) {
    badge.textContent    = newConf ? '✓' : '?';
    badge.dataset.tooltip = newConf
      ? 'Gloss confirmed by the author'
      : 'Automatically glossed from previous examples, needs confirmation by the author';
    badge.classList.toggle('confirmed', newConf);
  }
  // Save to server
  try {
    await fetch(glossUrl(), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sentence_id: sid, gloss: glosses[sid]}),
      keepalive: true,
    });
  } catch(e) { console.error(e); }
}

async function saveColGloss(sid, colIdx, value, statusEl) {
  const s = sentences.find(x => x.id === sid);
  if (!s) return;
  const stored   = glosses[sid];
  const {tokens, colGlosses} = buildAlignment(s.words,
    stored && typeof stored === 'object' ? stored : null);
  colGlosses[colIdx] = value;
  // Changing a gloss resets confirmation — author must re-confirm
  const newData = {tokens, glosses: colGlosses, confirmed: false};
  glosses[sid]  = newData;
  updateBadge(sid, colGlosses);

  // Update concordance and propagate new suggestion to matching dropdowns
  if (value) {
    const key = getColKey(s.words, tokens, colIdx);
    if (!concordance[key]) concordance[key] = new Set();
    if (!concordance[key].has(value)) {
      concordance[key].add(value);
      addOptionToMatchingDropdowns(key, value);
    }
  }

  try {
    await fetch(glossUrl(), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sentence_id: sid, gloss: newData}),
      keepalive: true
    });
    if (statusEl) {
      statusEl.textContent = '✓ saved';
      statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 1200);
    }
  } catch(e) { console.error(e); }
}

function addOptionToMatchingDropdowns(key, newGloss) {
  // Add the new gloss option to any dropdown whose column matches this key
  document.querySelectorAll('.fn-gloss-control').forEach(ctrl => {
    const sid    = ctrl.dataset.sid;
    const col    = parseInt(ctrl.dataset.col);
    const s      = sentences.find(x => x.id === sid);
    if (!s) return;
    const stored = glosses[sid];
    const {tokens} = buildAlignment(s.words,
      stored && typeof stored === 'object' ? stored : null);
    if (getColKey(s.words, tokens, col) !== key) return;
    const sel = ctrl.querySelector('.fn-gloss-select');
    if (!sel) return;
    // Check if option already exists
    if ([...sel.options].some(o => o.value === newGloss)) return;
    const newOpt = document.createElement('option');
    newOpt.value = newGloss;
    newOpt.textContent = newGloss;
    // Insert before the "+ New" option
    const plusOpt = [...sel.options].find(o => o.value === '__new__');
    sel.insertBefore(newOpt, plusOpt || null);
  });
}

function bindColGlossFull() {
  // Dropdowns (concordance suggestions)
  document.querySelectorAll('.fn-gloss-control').forEach(ctrl => {
    const sid    = ctrl.dataset.sid;
    const col    = parseInt(ctrl.dataset.col);
    const sel    = ctrl.querySelector('.fn-gloss-select');
    const inp    = ctrl.querySelector('.fn-gloss-new-input');
    const status = ctrl.querySelector('.tx-gloss-save-status');

    sel.addEventListener('change', async () => {
      if (sel.value === '__new__') {
        inp.style.display = ''; inp.focus();
      } else {
        inp.style.display = 'none';
        await saveColGloss(sid, col, sel.value, status);
      }
    });
    const saveNew = async () => {
      const v = inp.value.trim();
      if (!v) return;
      await saveColGloss(sid, col, v, status);
      // Switch back to select showing new value
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v; opt.selected = true;
      const plusOpt = [...sel.options].find(o => o.value === '__new__');
      sel.insertBefore(opt, plusOpt || null);
      inp.style.display = 'none';
      sel.value = v;
    };
    inp.addEventListener('blur', saveNew);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveNew(); }});
  });

  // Confirmation badges — clickable only when logged in
  document.querySelectorAll('.gloss-badge:not(.no-click)').forEach(badge => {
    badge.addEventListener('click', () => toggleConfirmation(badge.dataset.sid));
  });

  // Plain inputs (no prior concordance entry)
  document.querySelectorAll('.fn-col-gloss').forEach(inp => {
    const sid = inp.dataset.sid;
    const col = parseInt(inp.dataset.col);
    const status = document.getElementById(`gstatus-${sid}-${col}`);
    inp.addEventListener('input', () => {
      clearTimeout(saveTimers[`${sid}_c${col}`]);
      saveTimers[`${sid}_c${col}`] = setTimeout(
        () => saveColGloss(sid, col, inp.value, status), 600
      );
    });
    inp.addEventListener('blur', () => {
      clearTimeout(saveTimers[`${sid}_c${col}`]);
      saveColGloss(sid, col, inp.value, status);
    });
  });
}

// ── Gloss auto-save ───────────────────────────────────────────
async function saveGloss(sentenceId, value, statusEl) {
  try {
    const r = await fetch(glossUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sentence_id: sentenceId, gloss: value }),
      keepalive: true,
    });
    const d = await r.json();
    if (d.ok) {
      glosses[sentenceId] = value;
      statusEl.textContent = '✓ saved';
      statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 1500);
    }
  } catch(e) {
    statusEl.textContent = '⚠ error';
    statusEl.classList.add('visible');
  }
}

// ── Render ────────────────────────────────────────────────────
function render(data) {
  sentences = data.sentences;
  const main = document.getElementById('tx-main');
  const nav  = document.getElementById('tx-nav');

  // Update page title and topnav
  document.title = `${data.title || textTitle} — DBT Gaua`;
  document.getElementById('topnav-lang').textContent = textLang;

  // Header
  const nSentences = sentences.length;
  main.innerHTML = `
    <div class="tx-header">
      <a class="tx-back" href="texts.html">← Back to Texts</a>
      <div class="tx-title" style="color:${langColor};">${data.title || textTitle}</div>
      <div class="tx-meta">
        <span style="color:${langColor};">${textLang}</span>
        <span>Recorded 2003 · A. François</span>
        <span>${nSentences} phrase${nSentences !== 1 ? 's' : ''}</span>
      </div>
    </div>
    <div class="gloss-legend${isLoggedIn ? ' visible' : ''}" id="gloss-legend">
      <strong>Author mode:</strong> click any gloss line to edit it.
      Use standard Leipzig abbreviations (e.g. <code>3PL NEG know properly</code>).
      Changes are saved automatically.
    </div>
    <div id="phrases-container"></div>`;

  const container = document.getElementById('phrases-container');

  sentences.forEach(s => {
    const audioInfo = ''; // audio timestamps not shown in viewer

    // ── Gloss section ──────────────────────────────────────────
    // Case A: XML has embedded W/M glosses → render word-aligned table
    // Case B: no embedded glosses → render editable input (if logged in) or stored gloss
    let glossSection = '';

    if (s.is_comparative && s.words && s.words.length) {
      // Case C: fieldnotes — column-aligned interlinear table
      // Columns = tokens (words/affixes/clitics), rows = languages
      glossSection = buildComparativeSection(s, glosses[s.id], isLoggedIn);

    } else if (s.has_gloss && s.words && s.words.length) {
      // Case A: word-aligned interlinear from XML
      const wordCols = s.words.map(w =>
        `<span class="tx-word">
          <span class="tx-word-form">${w.form}</span>
          <span class="tx-word-gloss">${w.gloss || '&nbsp;'}</span>
        </span>`
      ).join('');
      glossSection = `<div class="tx-aligned">${wordCols}</div>`;
    } else {
      // Case B: no embedded XML glosses → column-aligned table (same as fieldnotes)
      glossSection = buildNarrativeSection(s, glosses[s.id] || null, isLoggedIn);
    }

    // ── Translation line ───────────────────────────────────────
    const translLangTag = s.transl_lang && s.transl_lang !== 'en'
      ? `<span class="tx-transl-lang">${s.transl_lang}</span>`
      : '';

    const div = document.createElement('div');
    div.className = 'tx-phrase';
    div.id = s.id;
    div.dataset.hasGloss    = s.has_gloss     ? '1' : '0';
    div.dataset.comparative = s.is_comparative ? '1' : '0';
    // Case B and C handle form/translation internally; Case A keeps the 3-line layout
    const isColAligned = s.is_comparative || !s.has_gloss;
    const formLine = isColAligned
      ? ''
      : `<div class="tx-form" style="color:${langColor};">${s.form}</div>`;
    // Translation div: only for Case A (Cases B & C render it inside glossSection)
    const translDiv = isColAligned
      ? ''
      : `<div class="tx-transl">${translLangTag}${s.transl}</div>`;

    div.innerHTML = `
      <div class="tx-phrase-id">${s.id} ${audioInfo}</div>
      ${formLine}
      ${glossSection}
      ${translDiv}`;
    container.appendChild(div);

    // Sidebar nav entry
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${s.id}">
      <span class="tx-nav-id">${s.id.split('_').pop()}</span>
      ${s.form.slice(0, 28)}${s.form.length > 28 ? '…' : ''}
    </a>`;
    nav.appendChild(li);
  });

  // Bind Case B gloss inputs (single-line editable, non-comparative)
  if (isLoggedIn) {
    container.querySelectorAll('.tx-gloss-input:not(.fn-col-gloss)').forEach(input => {
      const sid = input.dataset.sid;
      const statusEl = document.getElementById('status-' + sid);
      input.addEventListener('input', () => {
        clearTimeout(saveTimers[sid]);
        saveTimers[sid] = setTimeout(() => saveGloss(sid, input.value, statusEl), 600);
      });
      input.addEventListener('blur', () => {
        clearTimeout(saveTimers[sid]);
        saveGloss(sid, input.value, statusEl);
      });
    });
    // Bind per-column gloss inputs (comparative / fieldnotes)
    bindColGlossFull();
  }

  bindScrollspy();
}

// ── Auth callback ─────────────────────────────────────────────
function onAuthChange(loggedIn) {
  if (!sentences.length) return;

  // Re-render full comparative sections on auth change (edit btn appears/disappears)
  document.querySelectorAll('.tx-phrase[data-comparative="1"]').forEach(phrase => {
    const sid = phrase.id;
    const s   = sentences.find(x => x.id === sid);
    if (!s) return;
    const display = document.getElementById('fn-display-' + sid);
    if (!display) return;
    const {tokens, colGlosses, nCols} = buildAlignment(s.words, glosses[sid]);
    display.innerHTML = renderAlignedTable(s.words, tokens, colGlosses, nCols, sid, loggedIn);
    const editBtn = phrase.querySelector('.fn-edit-btn');
    if (editBtn) editBtn.style.display = loggedIn ? '' : 'none';
    // Update badge clickability
    document.querySelectorAll('.gloss-badge').forEach(b => {
      b.classList.toggle('no-click', !loggedIn);
    });
    document.getElementById('tx-tooltip').classList.toggle('interactive', loggedIn);
    if (loggedIn) { buildConcordanceFromGlosses(); bindColGlossFull(); bindNarrGlossInputs(); bindTranslationInputs(); }
  });

  // Re-render editable gloss inputs for Case B phrases (single-line)
  document.querySelectorAll('.tx-phrase[data-has-gloss="0"]').forEach(phrase => {
    const sid  = phrase.id;
    const wrap = phrase.querySelector('.tx-gloss-wrap');
    if (!wrap) return;
    const g     = glosses[sid] || '';
    const label = wrap.querySelector('.tx-gloss-label');
    // Remove everything after the label
    while (wrap.children.length > 1) wrap.removeChild(wrap.lastChild);
    if (loggedIn) {
      const input = document.createElement('input');
      input.className    = 'tx-gloss-input';
      input.type         = 'text';
      input.dataset.sid  = sid;
      input.value        = g;
      input.placeholder  = 'Add interlinear gloss…';
      input.spellcheck   = false;
      const statusEl = document.createElement('span');
      statusEl.className = 'tx-gloss-save-status';
      statusEl.id = 'status-' + sid;
      wrap.appendChild(input);
      wrap.appendChild(statusEl);
      input.addEventListener('input', () => {
        clearTimeout(saveTimers[sid]);
        saveTimers[sid] = setTimeout(() => saveGloss(sid, input.value, statusEl), 600);
      });
      input.addEventListener('blur', () => {
        clearTimeout(saveTimers[sid]);
        saveGloss(sid, input.value, statusEl);
      });
    } else {
      const span = document.createElement('span');
      span.className   = g ? 'tx-gloss-text' : 'tx-gloss-text empty';
      span.textContent = g || '—';
      wrap.appendChild(span);
    }
  });

  const legend = document.getElementById('gloss-legend');
  // Show legend only if there are Case B (manually gloss-able) sentences
  const hasCaseB = document.querySelector('.tx-phrase[data-has-gloss="0"], .tx-phrase[data-comparative="1"]');
  if (legend) legend.classList.toggle('visible', loggedIn && !!hasCaseB);
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
  bindLoginModal();
  await Promise.all([checkAuth(), loadDictionary(), loadAbbrevLinks()]);

  const hasSrc = isFieldnotes ? true : !!textKey;
  if (!hasSrc) {
    document.getElementById('tx-main').innerHTML =
      '<p class="tx-loading tx-error">No text key specified in URL.</p>';
    return;
  }

  try {
    // Choose endpoint based on source type
    const txEndpoint = isFieldnotes
      ? `/api/fieldnotes/tx/${fnIndex}`
      : `/api/transcription/${encodeURIComponent(textKey)}`;
    const glEndpoint = glossUrl();

    const [txResp, glResp] = await Promise.all([
      fetch(txEndpoint), fetch(glossUrl())
    ]);
    if (!txResp.ok) {
      const body = await txResp.text();
      throw new Error(`HTTP ${txResp.status}: ${body.slice(0,200)}`);
    }
    const [txData, glData] = await Promise.all([
      txResp.json(),
      glResp.ok ? glResp.json() : Promise.resolve({})
    ]);
    glosses = glData;
    buildConcordanceFromGlosses();
    render(txData);
    bindNarrGlossInputs();
    bindTranslationInputs();
    bindHoverTooltips();
    _bindTooltipInteraction();
  } catch(e) {
    document.getElementById('tx-main').innerHTML =
      `<p class="tx-loading tx-error">Could not load transcription: ${e.message}</p>`;
  }
}

init();
</script>
