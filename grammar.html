<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparative Grammar — DBT Gaua Languages</title>
<link rel="stylesheet" href="style.css">
<style>

/* ── Layout ── */
.grammar-shell {
  display: grid;
  grid-template-columns: 210px 1fr;
  min-height: calc(100vh - 52px);
}

/* ── Sidebar ── */
.grammar-sidebar {
  background: #faf6ef;
  border-right: 1px solid var(--border);
  padding: 1.4rem 0 3rem;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.sidebar-section-label {
  font-family: 'Crimson Pro', serif;
  font-size: 0.67rem; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--ink-light); padding: 0 1rem 0.4rem; display: block;
}
.toc-list { list-style: none; padding: 0; margin: 0; }
.toc-list a {
  display: block; font-family: 'Crimson Pro', serif; font-size: 1rem;
  color: var(--ink-mid); text-decoration: none;
  padding: 3px 1rem 3px 1.1rem;
  border-left: 3px solid transparent;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.toc-list a:hover  { background: #ede4d4; color: var(--ink); }
.toc-list a.active { background: #e8d8b8; color: var(--ink); border-left-color: var(--gold); font-weight: 500; }

/* Language toggle pills in sidebar */
.sidebar-lang-head {
  margin-top: 1.6rem;
  padding: 0 1rem 0.4rem;
}
.lang-pills-wrap { padding: 0 0.85rem 0.5rem; display: flex; flex-wrap: wrap; gap: 4px; }
.lang-pill {
  font-family: 'Crimson Pro', serif; font-variant: small-caps;
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em;
  padding: 2px 8px 2px; border-radius: 3px;
  border: 1.5px solid transparent; cursor: pointer; color: white;
  transition: opacity 0.15s, box-shadow 0.15s; line-height: 1.4;
}
.lang-pill.active { opacity: 1; box-shadow: 0 0 0 2px #faf6ef, 0 0 0 3.5px currentColor; }
.lang-pill:not(.active) { opacity: 0.35; }
.lang-pill:hover { opacity: 0.8; }

/* ── Main content ── */
.grammar-main { padding: 2.5rem 4rem 6rem; max-width: 860px; }

/* Author toolbar */
.author-bar {
  display: none; /* shown via JS when logged in */
  align-items: center; gap: 0.75rem; flex-wrap: wrap;
  background: #1c0f06; border-radius: 6px;
  padding: 0.55rem 1rem; margin-bottom: 2rem;
  font-family: 'Crimson Pro', serif; font-size: 0.85rem; color: #c9a458;
}
.author-bar.visible { display: flex; }
.author-bar-label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
.author-btn {
  font-family: 'Crimson Pro', serif; font-size: 0.82rem;
  color: #f0dfc0; background: rgba(255,255,255,0.07);
  border: 1px solid rgba(201,164,88,0.35); border-radius: 3px;
  padding: 3px 12px 4px; cursor: pointer; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}
.author-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(201,164,88,0.7); }
.author-btn.danger { border-color: rgba(180,60,40,0.5); color: #f0c0b0; }
.author-btn.danger:hover { background: rgba(180,60,40,0.2); }
.upload-status { font-size: 0.75rem; opacity: 0.55; }
.upload-status span { opacity: 1; }

/* Section wrapper */
.grammar-section { margin-bottom: 3.5rem; scroll-margin-top: 1.5rem; }
.section-loading {
  font-family: 'Crimson Pro', serif; font-style: italic;
  color: var(--ink-light); font-size: 1rem; padding: 1rem 0;
}
.section-error { color: #922810; font-style: normal; font-size: 0.9rem; }

/* Edit controls per section */
.section-edit-bar {
  display: none;
  justify-content: flex-end; gap: 0.5rem;
  margin-bottom: 0.6rem;
}
.section-edit-bar.visible { display: flex; }
.sec-btn {
  font-family: 'Crimson Pro', serif; font-size: 0.78rem;
  color: var(--ink-mid); background: #f0e8d8;
  border: 1px solid var(--border); border-radius: 3px;
  padding: 2px 10px 3px; cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.sec-btn:hover { background: #e8d8b8; border-color: var(--gold); }
.sec-btn.primary { color: white; background: var(--gold); border-color: var(--gold); }
.sec-btn.primary:hover { background: #7a5010; }

/* Markdown editor */
.md-editor-wrap {
  display: none;
  flex-direction: column; gap: 0.6rem;
}
.md-editor-wrap.visible { display: flex; }
.md-editor-wrap textarea {
  font-family: 'Source Code Pro', monospace; font-size: 0.85rem;
  line-height: 1.65; color: var(--ink);
  background: #fffef8; border: 1.5px solid var(--border);
  border-radius: 4px; padding: 1rem; resize: vertical;
  min-height: 340px; outline: none;
  transition: border-color 0.15s;
}
.md-editor-wrap textarea:focus { border-color: var(--gold); }

/* Shortcode reference panel */
.shortcode-ref {
  background: #f5f0e8; border: 1px solid var(--border);
  border-radius: 4px; padding: 0.7rem 1rem; font-size: 0.8rem;
  font-family: 'Crimson Pro', serif; color: var(--ink-light);
}
.shortcode-ref code {
  font-family: 'Source Code Pro', monospace; font-size: 0.78rem;
  background: #e8dfc8; border-radius: 2px; padding: 0 4px;
  color: var(--ink);
}
.shortcode-ref ul { margin: 0.3rem 0 0 1rem; padding: 0; }
.shortcode-ref li { margin-bottom: 0.2rem; }

/* ── Server-rendered grammar content styles ── */

/* These target HTML produced by Flask/Python-Markdown */
.grammar-section h2 {
  font-family: 'EB Garamond', serif; font-size: 1.75rem; font-weight: 500;
  color: var(--ink); border-bottom: 2px solid var(--gold);
  padding-bottom: 0.3rem; margin: 0 0 1.2rem;
}
.grammar-section h3 {
  font-family: 'EB Garamond', serif; font-size: 1.25rem; font-weight: 500;
  color: var(--ink); margin: 1.8rem 0 0.6rem;
}
.grammar-section p {
  font-family: 'Crimson Pro', serif; font-size: 1.08rem;
  line-height: 1.78; color: var(--ink-mid); margin-bottom: 0.9rem;
}
.grammar-section strong { font-weight: 600; color: var(--ink); }
.grammar-section em     { font-style: italic; }
.grammar-section table {
  border-collapse: collapse; margin: 1rem 0;
  font-family: 'Crimson Pro', serif; font-size: 0.98rem;
}
.grammar-section table th {
  font-variant: small-caps; letter-spacing: 0.05em;
  background: #f0e8d8; border: 1px solid var(--border);
  padding: 4px 14px 5px; text-align: left;
}
.grammar-section table td {
  border: 1px solid var(--border-lt); padding: 4px 14px 5px;
}

/* Entry chip ({{entry:…}} output) */
.entry-chip {
  display: inline-flex; align-items: baseline; gap: 4px;
  font-family: 'EB Garamond', serif; font-size: 1.02rem;
  text-decoration: none; color: var(--ink);
  border-bottom: 1.5px dotted var(--gold);
  border-radius: 2px; padding: 0 2px;
  transition: color 0.12s, background 0.12s;
}
.entry-chip:hover { color: #b84c10; background: #fff5e8; border-bottom-color: #b84c10; }
.chip-forms { font-size: 1rem; }
.chip-form  { font-family: 'EB Garamond', serif; }
.chip-gloss { font-family: 'Crimson Pro', serif; font-size: 0.88rem; font-style: italic; color: var(--ink-light); }

/* Example block ({{example:…}} output) */
.example-block { margin: 1.4rem 0; }
.example-wrap  {
  background: #faf6ef; border-left: 3px solid var(--gold);
  border-radius: 0 4px 4px 0; padding: 0.75rem 1.2rem 0.9rem;
  overflow-x: auto; display: inline-block; min-width: 240px; max-width: 100%;
}
.ex-table    { border-collapse: collapse; white-space: nowrap; }
.ex-abbr     { font-family: 'Crimson Pro', serif; font-variant: small-caps; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.05em; padding: 2px 14px 2px 0; vertical-align: baseline; border: none; }
.ex-cell     { padding: 2px 16px 2px 0; vertical-align: baseline; border: none; }
.ex-cell.ex-dash { font-family: 'EB Garamond', serif; font-size: 1.1rem; color: #ccc; }
.ex-cell a.lexlink { font-family: 'EB Garamond', serif; font-size: 1.1rem; color: var(--ink); text-decoration: none; border-bottom: 1.5px dotted var(--gold); padding: 0 2px; border-radius: 2px; transition: color 0.12s, background 0.12s; }
.ex-cell a.lexlink:hover { color: #b84c10; background: #fff5e8; border-bottom-color: #b84c10; }
.ex-sep td   { border-top: 1px solid var(--border); padding: 0; height: 0; border-bottom: none; }
.ex-gloss-empty { border: none; padding: 5px 14px 3px 0; vertical-align: baseline; }
.ex-gloss    { font-family: 'Source Code Pro', monospace; font-size: 0.63rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-light); padding: 5px 16px 3px 0; vertical-align: baseline; border: none; }
.ex-transl   { font-family: 'Crimson Pro', serif; font-style: italic; font-size: 1rem; color: var(--ink-mid); margin-top: 6px; }
.corpus-ref  { display: inline-flex; align-items: center; gap: 5px; font-family: 'Crimson Pro', serif; font-size: 0.8rem; color: #2a4a6a; border: 1px solid #a0bcd0; border-radius: 3px; padding: 2px 10px 3px; text-decoration: none; margin-top: 7px; transition: background 0.12s, color 0.12s; }
.corpus-ref:hover { background: #2a4a6a; color: white; }

/* Hidden language rows */
tr[data-lang].lang-hidden { display: none; }

/* Shortcode errors */
.shortcode-error { font-family: 'Source Code Pro', monospace; font-size: 0.8rem; color: #922810; background: #fef0ee; border: 1px solid #f0c0b8; border-radius: 3px; padding: 2px 8px; display: inline-block; }

/* ── Login modal ── */
.modal-backdrop {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.55); align-items: center; justify-content: center;
}
.modal-backdrop.visible { display: flex; }
.modal-box {
  background: #f7f2ea; border-radius: 6px; padding: 2rem 2.5rem;
  box-shadow: 0 8px 40px rgba(0,0,0,0.35); min-width: 300px;
  font-family: 'Crimson Pro', serif;
}
.modal-box h3 { font-family: 'EB Garamond', serif; font-size: 1.4rem; margin: 0 0 1rem; }
.modal-box input[type=password] {
  width: 100%; padding: 6px 10px; font-size: 1rem;
  border: 1px solid var(--border); border-radius: 3px;
  font-family: 'Crimson Pro', serif; outline: none; box-sizing: border-box;
  transition: border-color 0.15s; margin-bottom: 0.8rem;
}
.modal-box input:focus { border-color: var(--gold); }
.modal-row { display: flex; gap: 0.6rem; justify-content: flex-end; }
.modal-err { color: #922810; font-size: 0.88rem; margin-bottom: 0.5rem; min-height: 1.2em; }

</style>
</head>
<body>

<!-- ── Login modal ── -->
<div class="modal-backdrop" id="login-modal">
  <div class="modal-box">
    <h3>Author login</h3>
    <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password">
    <div class="modal-err" id="login-err"></div>
    <div class="modal-row">
      <button class="sec-btn" id="login-cancel">Cancel</button>
      <button class="sec-btn primary" id="login-submit">Log in</button>
    </div>
  </div>
</div>

<nav class="topnav">
  <a class="topnav-brand" href="index.html">◬ DBT Gaua</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="grammar.html" class="active">Grammar</a></li>
    <li><a href="texts.html">Texts</a></li>
    <li><a href="dictionary.html">Dictionary</a></li>
  </ul>
  <div class="topnav-right">Comparative Grammar · 5 Languages</div>
</nav>

<div class="grammar-shell">

  <!-- ── Sidebar ── -->
  <aside class="grammar-sidebar">
    <span class="sidebar-section-label">Contents</span>
    <ul class="toc-list" id="toc-list">
      <li><a href="#s1">§1 Negation</a></li>
    </ul>

    <div class="sidebar-lang-head">
      <span class="sidebar-section-label">Show languages</span>
    </div>
    <div class="lang-pills-wrap" id="lang-pills"></div>
  </aside>

  <!-- ── Main ── -->
  <main class="grammar-main">

    <!-- Author toolbar (hidden until logged in) -->
    <div class="author-bar" id="author-bar">
      <span class="author-bar-label">Author mode</span>

      <label class="author-btn" style="cursor:pointer;" title="Upload dictionary XML">
        📖 Dict XML
        <input type="file" accept=".xml" id="upload-dict-input" style="display:none;">
      </label>

      <label class="author-btn" style="cursor:pointer;" title="Upload corpus XML">
        🎧 Corpus XML
        <input type="file" accept=".xml" id="upload-corpus-input" style="display:none;">
      </label>

      <span class="upload-status" id="upload-status"></span>
      <span style="flex:1;"></span>
      <button class="author-btn danger" id="logout-btn">Log out</button>
    </div>

    <!-- Sections loaded dynamically -->
    <div id="sections-container"></div>

    <!-- Login link for non-logged-in state -->
    <div id="login-prompt" style="margin-top:3rem; font-family:'Crimson Pro',serif; font-size:0.85rem; color:var(--ink-light); display:none;">
      <a href="#" id="login-link" style="color:var(--gold);">Author login</a>
    </div>

  </main>
</div>

<script>
'use strict';

// ── Language constants ─────────────────────────────────────────
const LANGS5   = ['Nume','Dorig','Koro','Olrat','Lakon'];
const COLORS5  = { Nume:'#2e5c8a', Dorig:'#c07820', Koro:'#922810', Olrat:'#267040', Lakon:'#5c2878' };

// ── State ──────────────────────────────────────────────────────
let isLoggedIn  = false;
let activeLangs = new Set(LANGS5);   // all shown by default

// ══════════════════════════════════════════════════════════════
//  LANGUAGE TOGGLE PILLS
// ══════════════════════════════════════════════════════════════
function buildLangPills() {
  const wrap = document.getElementById('lang-pills');
  LANGS5.forEach(lang => {
    const btn = document.createElement('button');
    btn.className   = 'lang-pill active';
    btn.textContent = lang;
    btn.style.background = COLORS5[lang];
    btn.dataset.lang = lang;
    btn.addEventListener('click', () => {
      if (activeLangs.has(lang)) {
        if (activeLangs.size === 1) return; // keep at least one
        activeLangs.delete(lang);
        btn.classList.remove('active');
      } else {
        activeLangs.add(lang);
        btn.classList.add('active');
      }
      applyLangFilter();
    });
    wrap.appendChild(btn);
  });
}

function applyLangFilter() {
  document.querySelectorAll('tr[data-lang]').forEach(row => {
    row.classList.toggle('lang-hidden', !activeLangs.has(row.dataset.lang));
  });
}

// ══════════════════════════════════════════════════════════════
//  SECTION LOADING
// ══════════════════════════════════════════════════════════════
async function loadSection(id) {
  const container = document.getElementById('sections-container');

  // Create section wrapper
  const wrap = document.createElement('div');
  wrap.className = 'grammar-section';
  wrap.id = id;
  wrap.innerHTML = `
    <div class="section-edit-bar" id="editbar-${id}">
      <button class="sec-btn" onclick="enterEditMode('${id}')">✏️ Edit section</button>
    </div>
    <div class="section-content" id="content-${id}">
      <p class="section-loading">Loading §…</p>
    </div>
    <div class="md-editor-wrap" id="editor-${id}">
      <textarea id="textarea-${id}" spellcheck="false"></textarea>
      <div class="shortcode-ref">
        <strong>Shortcodes:</strong>
        <ul>
          <li><code>{{example: negation_example_01}}</code> — inserts interlinear table from corpus XML</li>
          <li><code>{{entry: speech}}</code> — inserts inline word chip from dictionary XML</li>
        </ul>
        Markdown supported: <code>**bold**</code>, <code>*italic*</code>, <code>## heading</code>, tables, etc.
      </div>
      <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
        <button class="sec-btn" onclick="cancelEdit('${id}')">Cancel</button>
        <button class="sec-btn primary" onclick="saveSection('${id}')">Save & render</button>
      </div>
    </div>`;
  container.appendChild(wrap);

  // Fetch rendered HTML from Flask
  try {
    const resp = await fetch(`/api/grammar/${id}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    document.getElementById(`content-${id}`).innerHTML = data.html;
    applyLangFilter();
  } catch (e) {
    document.getElementById(`content-${id}`).innerHTML =
      `<p class="section-error">Could not load section ${id}: ${e.message}</p>`;
  }
}

// ══════════════════════════════════════════════════════════════
//  EDIT MODE
// ══════════════════════════════════════════════════════════════
async function enterEditMode(id) {
  try {
    const resp = await fetch(`/api/grammar/${id}/source`);
    if (resp.status === 401) { showLogin(); return; }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    document.getElementById(`textarea-${id}`).value = data.source;
    document.getElementById(`content-${id}`).style.display = 'none';
    document.getElementById(`editor-${id}`).classList.add('visible');
  } catch (e) {
    alert('Could not load source: ' + e.message);
  }
}

async function saveSection(id) {
  const source = document.getElementById(`textarea-${id}`).value;
  try {
    const resp = await fetch(`/api/grammar/${id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source })
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    document.getElementById(`content-${id}`).innerHTML = data.html;
    applyLangFilter();
    cancelEdit(id);
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function cancelEdit(id) {
  document.getElementById(`content-${id}`).style.display = '';
  document.getElementById(`editor-${id}`).classList.remove('visible');
}

// ══════════════════════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════════════════════
function updateAuthUI() {
  const bar    = document.getElementById('author-bar');
  const prompt = document.getElementById('login-prompt');
  const bars   = document.querySelectorAll('.section-edit-bar');

  if (isLoggedIn) {
    bar.classList.add('visible');
    prompt.style.display = 'none';
    bars.forEach(b => b.classList.add('visible'));
    refreshUploadStatus();
  } else {
    bar.classList.remove('visible');
    prompt.style.display = 'block';
    bars.forEach(b => b.classList.remove('visible'));
  }
}

async function refreshUploadStatus() {
  try {
    const data = await fetch('/api/upload/status').then(r => r.json());
    const el = document.getElementById('upload-status');
    el.innerHTML =
      `<span title="Dictionary XML">${data.dictionary ? '📖✓' : '📖✗'}</span> ` +
      `<span title="Corpus XML">${data.corpus ? '🎧✓' : '🎧✗'}</span>`;
  } catch(e) {}
}

function showLogin() {
  document.getElementById('login-modal').classList.add('visible');
  document.getElementById('login-pw').focus();
  document.getElementById('login-err').textContent = '';
}
function hideLogin() {
  document.getElementById('login-modal').classList.remove('visible');
  document.getElementById('login-pw').value = '';
}

async function doLogin() {
  const pw = document.getElementById('login-pw').value;
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await resp.json();
    if (data.ok) {
      isLoggedIn = true;
      hideLogin();
      updateAuthUI();
    } else {
      document.getElementById('login-err').textContent = 'Wrong password.';
    }
  } catch(e) {
    document.getElementById('login-err').textContent = 'Network error.';
  }
}

async function doLogout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  isLoggedIn = false;
  updateAuthUI();
}

// ══════════════════════════════════════════════════════════════
//  XML UPLOAD
// ══════════════════════════════════════════════════════════════
async function uploadXML(file, endpoint, sectionToReload) {
  const form = new FormData();
  form.append('file', file);
  try {
    const resp = await fetch(endpoint, { method: 'POST', body: form });
    const data = await resp.json();
    if (data.ok) {
      await refreshUploadStatus();
      // Reload all sections so shortcodes resolve against new XML
      if (sectionToReload) {
        const el = document.getElementById(`content-${sectionToReload}`);
        if (el) {
          el.innerHTML = '<p class="section-loading">Reloading…</p>';
          const r2 = await fetch(`/api/grammar/${sectionToReload}`);
          const d2 = await r2.json();
          el.innerHTML = d2.html;
          applyLangFilter();
        }
      }
    } else {
      alert('Upload error: ' + (data.error || 'Unknown error'));
    }
  } catch(e) {
    alert('Upload failed: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════════════
//  SCROLLSPY (TOC sidebar)
// ══════════════════════════════════════════════════════════════
function bindScrollspy() {
  const links = document.querySelectorAll('.toc-list a');
  window.addEventListener('scroll', () => {
    let active = null;
    document.querySelectorAll('.grammar-section').forEach(sec => {
      if (sec.getBoundingClientRect().top < 120) active = sec.id;
    });
    links.forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + active);
    });
  }, { passive: true });
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
async function init() {
  buildLangPills();

  // Check auth
  try {
    const status = await fetch('/api/auth/status').then(r => r.json());
    isLoggedIn = status.logged_in;
  } catch(e) { /* Flask not running — view-only mode */ }

  // Load grammar sections
  const sectResp = await fetch('/api/grammar').then(r => r.json()).catch(() => ({ sections: [{ id: 's1' }] }));
  for (const sec of sectResp.sections) {
    await loadSection(sec.id);
  }

  updateAuthUI();
  bindScrollspy();

  // Login modal bindings
  document.getElementById('login-submit').addEventListener('click', doLogin);
  document.getElementById('login-cancel').addEventListener('click', hideLogin);
  document.getElementById('login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('login-modal').addEventListener('click', e => { if (e.target === e.currentTarget) hideLogin(); });
  document.getElementById('login-link').addEventListener('click', e => { e.preventDefault(); showLogin(); });
  document.getElementById('logout-btn').addEventListener('click', doLogout);

  // Upload bindings
  document.getElementById('upload-dict-input').addEventListener('change', e => {
    const f = e.target.files[0]; if (f) uploadXML(f, '/api/upload/dictionary', 's1');
  });
  document.getElementById('upload-corpus-input').addEventListener('change', e => {
    const f = e.target.files[0]; if (f) uploadXML(f, '/api/upload/corpus', 's1');
  });
}

init();
</script>
</body>
</html>
